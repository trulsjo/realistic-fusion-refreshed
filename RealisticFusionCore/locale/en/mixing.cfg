[fluid-name]
rf-tritium=Tritium
rf-helium-3=Helium-3
rf-d-t-mix=D-T mix
rf-d-he3-mix=D-He3 mix

[fluid-description]
rf-tritium=Hydrogen-3, bred by running D-D fusion. Half of every reaction leaves one behind. It does not occur in nature in any useful quantity, which is why reactors have to make their own.
rf-helium-3=The other half of the D-D reaction. Fuses without producing neutrons, so it is what the aneutronic tier is built around.
rf-d-t-mix=Deuterium blended with tritium. The easiest fusion fuel there is: it ignites far cooler than D-D.
rf-d-he3-mix=Deuterium blended with helium-3. Harder to ignite than D-T and nearly aneutronic in return.

[entity-name]
rf-gas-mixer=Gas mixer

[entity-description]
rf-gas-mixer=Blends deuterium with a bred fuel into the mix a reactor tier burns. It cannot make either input: deuterium comes from the enrichment chain, tritium and helium-3 from a running reactor.

[item-name]
rf-gas-mixer=Gas mixer

[item-description]
rf-gas-mixer=Blends deuterium with a bred fuel into the mix a reactor tier burns.

[recipe-name]
rf-d-t-mixing=D-T mix
rf-d-he3-mixing=D-He3 mix

[technology-name]
rf-gas-mixing=Fuel gas mixing

[technology-description]
rf-gas-mixing=Blend deuterium with tritium or helium-3 into reactor fuel. The mixer is ready before the fuel is: both bred inputs come out of a running D-D reactor.
