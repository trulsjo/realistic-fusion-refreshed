# What a reactor tells the player about itself (#25). Its own file rather than lines in d-d.cfg,
# because none of this belongs to a tier: a D-T reactor will report through the same three states
# and the same two signals.

[virtual-signal-name]
rf-signal-plasma-temperature=Plasma temperature
rf-signal-q-factor=Fusion Q factor

[virtual-signal-description]
rf-signal-plasma-temperature=A reactor's plasma temperature in degrees Celsius, from the reactor itself rather than from the pipe it shares.
rf-signal-q-factor=Fusion power out over heating power in, as a percentage. Above 100 the reactor is producing more than it is being given.

# The status line under a reactor's name. Three states, because three is what a player can act on:
# it is working, it is sitting there, or it has nothing to work with.
[rf-reactor-status]
running=Fusing
idle=Holding plasma, not fusing
starved=No plasma

# Never shown: no item places it and it has no GUI a player can reach. Named anyway, because
# scripts/locale-check.ps1 requires every entity this repo defines to resolve, and an entity that
# is meant to be invisible is exactly the one whose missing name nobody would notice.
[entity-name]
rf-reactor-signals=Reactor signals

[entity-description]
rf-reactor-signals=Carries a fusion reactor's readings to the circuit network. Part of the reactor; it cannot be built or removed on its own.
