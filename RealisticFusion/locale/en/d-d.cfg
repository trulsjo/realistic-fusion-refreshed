[recipe-name]
rf-d-d-plasma=D-D plasma

[recipe-description]
rf-d-d-plasma=Injected far below fusion temperature, so fuelling a running reactor cools it a little.

[technology-name]
rf-d-d-fusion=D-D fusion

[technology-description]
rf-d-d-fusion=Confine deuterium plasma and burn it against itself, the first fusion reaction to reach and the one that breeds the fuel for the rest.
