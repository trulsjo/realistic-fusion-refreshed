[fluid-name]
rf-d-d-plasma=D-D plasma
rf-reactor-energy=Reactor energy

[fluid-description]
rf-d-d-plasma=Deuterium ionised and confined. Its temperature is what the reaction rate is read from, so a plasma that cannot be kept hot does not fuse.
rf-reactor-energy=The energy leaving a reactor's plasma, carried as a fluid. One unit is one megajoule.

[entity-name]
rf-heater=Plasma heater
rf-reactor=Fusion reactor
rf-heat-exchanger=Fusion heat exchanger
rf-pipe=Plasma pipe
rf-pipe-to-ground=Underground plasma pipe

[entity-description]
rf-heater=Ionises deuterium into plasma and injects it. Reaching fusion temperature is the reactor's job, not this machine's.
rf-reactor=Confines and heats plasma, and computes its reaction rate from tabulated cross-section data. Reactors joined by plasma pipe share one pool at one temperature.
rf-heat-exchanger=Burns reactor energy to raise steam at 500 °C, which ordinary steam turbines accept.
rf-pipe=Carries plasma. Ordinary pipes cannot.
rf-pipe-to-ground=Carries plasma underground.

