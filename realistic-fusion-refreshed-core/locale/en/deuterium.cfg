[fluid-description]
rf-hydrogen=Electrolysed from water. Combined with sulfur to charge the Girdler sulfide loop.
rf-hydrogen-sulfide=The catalyst of the Girdler sulfide process. Recirculates rather than being consumed, so the loop needs charging only once.
rf-heavy-water=Deuterium oxide. The intermediate between water and deuterium.
rf-depleted-water=The spent stream leaving enrichment, stripped of its deuterium.
rf-deuterium=The fuel every fusion reaction in Realistic Fusion Refreshed consumes.

