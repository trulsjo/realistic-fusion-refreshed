# The game-free gates (#599): the ones that need neither Factorio nor Blender, so a hosted runner
# can run them. Every other gate starts the game and runs only where a person starts it -- see
# scripts/run-gates.ps1. No gate's -SelfTest runs here, the same as there. The body check below is
# not one of those gates, and its -SelfTest runs here and not there. Four tools under
# tools/ are not gates and have a --self-test that is all that checks them; those run here, as
# they do there (#659, #787). So does models/test_rf_blender.py, the render's and the kit's
# arithmetic, which needs no Blender and runs as a script of its own (#810, #803). Two more
# tools' self-tests, mesh-overlap and compare-sheets, run there and not here: this runner has no
# Blender, and its Python no Pillow (#850, #853). The self-tests of the eight session hooks wired
# from vendor/ run here and not there (#861): none is a gate, and each needs its wiring read.
#
# The pull request's body is checked by the shared pr-body-check.ps1 (#730): the pr template's
# three headings and, since #753, its four markers, no commit cited that is not on main, and no
# closing keyword outside a lone `Closes #N` line. `edited` is among the triggers so an edited body
# is checked again, and every other job skips that event, so a body edit runs the body check
# alone. The body reaches the script through the environment, never pasted into the command. The
# script refuses a shallow clone.
#
# workflow_dispatch starts it by hand on any branch, with no pull request (#813), so a planted
# proof runs on a throwaway branch and never on one that merges. It runs what a push to main runs,
# less the commit check, which has no range on it: a branch's commits are checked when its pull
# request opens. The body job runs on a pull request alone, so it is skipped as on a push.
#
#     gh workflow run gates.yml --ref <branch>
#
# Advisory: main has no branch protection, so a red check blocks nothing.
name: gates

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

jobs:
  body:
    name: Pull request body
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0   # the check tells a commit on main from one that is not
      - name: pr-body-check.ps1
        shell: pwsh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./vendor/grado-factorio-tools/scripts/pr-body-check.ps1 -Body "$env:PR_BODY"

  lua:
    name: Lua suites
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y lua5.4
      - name: tests/test-*.lua
        run: |
          failed=0
          for suite in tests/test-*.lua; do
            echo "::group::$suite"
            lua5.4 "$suite" || { failed=1; echo "::error::$suite failed"; }
            echo "::endgroup::"
          done
          exit $failed

  tools:
    name: Tools' self-tests and the render arithmetic
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's own Python: the four import nothing that has to be installed, and
      # review-coverage's builds a repository with the runner's git.
      - name: tools/*.py --self-test
        run: |
          failed=0
          for tool in refuse-hanging-bash review-usage rewrap review-coverage; do
            echo "::group::$tool"
            python3 "tools/$tool.py" --self-test || { failed=1; echo "::error::$tool failed"; }
            echo "::endgroup::"
          done
          exit $failed
      # A plain script, not a --self-test: it exits 0 or raises, and touches no bpy (#810).
      - name: models/test_rf_blender.py
        if: ${{ !cancelled() }}
        run: python3 models/test_rf_blender.py

  pwsh:
    name: ship-check and commit-check
    if: github.event.action != 'edited'
    # Windows because that is the only place these scripts have ever passed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0   # commit-check walks a range, and ship-check section 17 refuses a shallow clone
      - name: ship-check.ps1
        shell: pwsh
        run: ./scripts/ship-check.ps1
      # Only the commits this event brought: a pull request's own, or the ones in a push to main.
      # Neither range reaches back into the history the convention's check already fails on. A
      # dispatch brings no commits and has neither end, so it skips the step.
      - name: commit-check.ps1
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' }}
        shell: pwsh
        env:
          RANGE: >-
            ${{ github.event_name == 'pull_request'
                && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
                || format('{0}..{1}', github.event.before, github.event.after) }}
        run: ./vendor/grado-factorio-tools/scripts/commit-check.ps1 -ScopeFile commit-scopes.txt -Range $env:RANGE
      # Each file git tracks under .githooks must be mode 100755 (#862): off Windows git skips a
      # hook that is not executable, and a clone on Windows does not show it. Fails where git
      # tracks no file there.
      - name: Hooks committed executable
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          modes=$(git ls-files -s .githooks)
          if [ -z "$modes" ]; then echo "FAILED - git tracks no file under .githooks, so no mode was read."; exit 1; fi
          bad=$(printf '%s\n' "$modes" | awk '$1 != "100755"')
          if [ -n "$bad" ]; then echo "FAILED - not mode 100755, so git off Windows skips it:"; printf '%s\n' "$bad"; exit 1; fi
          echo "OK - $(printf '%s\n' "$modes" | wc -l | tr -d ' ') file(s) under .githooks, each mode 100755."
      # Three whole-tree checks from vendor/ that hold what ship-check.ps1 sections 7, 12 and 17
      # held, with this repository's own as their parameters (#863), so that #865 can delete
      # those sections. No hook runs the first two: a commit is never on origin/main before it is
      # pushed, and the citation check reads the whole tree. The pages the commits check exempts
      # are $RECORDS in ship-check.ps1; the citation check's -Foreign is section 7's whole-line
      # pattern, and its floors section 7's.
      - name: line-cite-check.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./vendor/grado-factorio-tools/scripts/line-cite-check.ps1 -Foreign '__|Script @|ORIG/|PORT/|_reference/|RealisticFusion|(?<![\w-])base/' -MinCitations 10 -MinContinuations 8
      - name: cited-commit-check.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./vendor/grado-factorio-tools/scripts/cited-commit-check.ps1 -Exempt 'docs/adr/,docs/agents/state-detail.md,docs/agents/code-review-history.md,docs/agents/code-review-evidence.md,docs/agents/review-figures.md'
      # The wrapped files docs/agents/code-review.md names, less the pre-PR review's SKILL.md,
      # whose front matter section 12 leaves alone and the shared check does not.
      - name: markdown-check.ps1 on the wrapped files
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./vendor/grado-factorio-tools/scripts/markdown-check.ps1 -Path 'docs/agents/code-review.md,docs/agents/review-figures.md,docs/agents/code-review-history.md,docs/agents/code-review-evidence.md,docs/agents/plugin-pass.md,CLAUDE.md,scripts/CLAUDE.md' -MaxLineLength 100
      - name: pr-body-check.ps1 -SelfTest
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./vendor/grado-factorio-tools/scripts/pr-body-check.ps1 -SelfTest
      # The session hooks .claude/settings.json wires from vendor/ (#861) refuse or warn in an
      # agent session and check nothing here, so their self-tests are the one place a change that
      # breaks one goes red. Each runs the command that file wires for it, so a wired command
      # that no longer reaches its script fails; the hanging-Bash one also fails where git does
      # not ignore its refusal log, .claude/refused-bash.log.
      - name: Session hooks' -SelfTest -Settings .claude/settings.json
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failed = @()
          foreach ($hook in 'ask-before-download', 'refuse-python-heredoc',
                  'refuse-backtick-substitution', 'refuse-hanging-bash', 'refuse-git-hook-skip',
                  'refuse-git-discard', 'refuse-cd-into-mod-cache', 'warn-skipped-install') {
            Write-Host "::group::$hook"
            pwsh -NoProfile -File "vendor/grado-factorio-tools/scripts/$hook.ps1" -SelfTest -Settings .claude/settings.json
            if ($LASTEXITCODE -ne 0) { $failed += $hook; Write-Host "::error::$hook failed" }
            Write-Host '::endgroup::'
          }
          if ($failed) { exit 1 }
