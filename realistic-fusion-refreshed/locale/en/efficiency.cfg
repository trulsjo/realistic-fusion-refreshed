# The plant-efficiency line (#96, ADR 0020).
#
# ONE name for three technologies, and the missing "-1" is not an omission -- the same trap
# confinement.cfg documents. A technology whose name ends in "-<number>" is a LEVEL to Factorio: it
# strips the suffix, looks up technology-name.rf-plant-efficiency, and renders the level itself.
# Numbering the keys here leaves all three showing "Unknown key", which scripts/locale-check.ps1
# catches. The descriptions below ARE numbered because each rung says something different, and
# prototypes/technology/efficiency.lua names those keys explicitly rather than relying on the
# default -- which would be stripped the same way and give three rungs one paragraph.
#
# THE PERCENTAGES ARE __1__ AND __2__ and come from the ladder in scripts/reactor-logic.lua, so a
# rung and its tooltip cannot disagree. Nothing here quotes a megawatt figure, deliberately: what a
# reactor sells depends on its plasma, so the same rung is worth a different number of megawatts at
# every temperature and every density.
[technology-name]
rf-plant-efficiency=Plant efficiency

[technology-description]
rf-plant-efficiency-1=Better first-wall coolant and a divertor that costs less to run. A reactor sells __2__ per cent of everything leaving its plasma instead of __1__.\n\nThe same fuel, the same reaction, more energy out. It does nothing for the Q factor, which measures the plasma and not the plant.
rf-plant-efficiency-2=High-temperature superconducting magnets. Holding the field is most of what a fusion plant spends on itself, and this is where real fusion engineering looks first. __2__ per cent recovered instead of __1__.\n\nHalf the remaining gain of the rung before it, and that is the shape of the whole line rather than a disappointment.
rf-plant-efficiency-3=Cryoplant and pumping losses cut to what the machine cannot do without. __2__ per cent recovered instead of __1__.\n\nThe last rung there is. Each step closes half the distance to a ceiling this line never reaches, so a fourth would be worth about an eighth of what the first was — and the reactor would still consume more than it returns when it is not fusing, which is what stops a fusion plant being a perpetual motion machine.
