# What a reactor tells the player about itself (#25). Its own file rather than lines in d-d.cfg,
# because none of this belongs to a tier: a D-T reactor will report through the same five states
# and the same two signals.

[virtual-signal-name]
rf-signal-plasma-temperature=Plasma temperature
rf-signal-q-factor=Fusion Q factor

[virtual-signal-description]
rf-signal-plasma-temperature=A reactor's plasma temperature in THOUSANDS of degrees Celsius, from the reactor itself rather than from the pipe it shares. A signal of 600 000 means 600 million °C, which is an ordinary temperature for deuterium fusion. The pipe's own tooltip shows the same plasma in whole degrees, so it reads a thousand times larger — write your conditions against this signal, not against the figure on the tooltip. Below 500 °C it reads 0, the same as a reactor with no plasma; the status line tells those apart.
rf-signal-q-factor=Fusion power out over heating power in, as a PERCENTAGE — 100 is break-even, 172 means the reactor produces 1.72 times what it is given. Not a quantity of anything, and not the reactor energy fluid.

# The status line under a reactor's name. Five states, and they answer two questions a player acts
# on: is it working at all, and is its plasma held at the density that suits it (#74, ADR 0016).
#
# lean and rich are the whole of how a player finds the density lever. A reactor makes MORE power
# under-supplied than full at the entry tier, and before these lines the only way to discover that
# was to wire the Q signal to something and experiment. They name the direction rather than a
# figure on purpose: the best density walks up as confinement research raises the plasma's
# confinement time, so any percentage written here would be wrong at most tech levels.
[rf-reactor-status]
running=Fusing at its best plasma density
lean=Fusing — more plasma would raise output
rich=Fusing — less plasma would raise output
idle=Holding plasma, not fusing
starved=Starved of plasma

# Never shown: no item places it and it has no GUI a player can reach. Named anyway, because
# scripts/locale-check.ps1 requires every entity this repo defines to resolve, and an entity that
# is meant to be invisible is exactly the one whose missing name nobody would notice.
[entity-name]
rf-reactor-signals=Reactor signals
rf-aneutronic-reactor-signals=Aneutronic reactor signals

[entity-description]
rf-reactor-signals=Carries a fusion reactor's readings to the circuit network. Part of the reactor; it cannot be built or removed on its own.
rf-aneutronic-reactor-signals=Carries an aneutronic reactor's readings to the circuit network. Part of the reactor; it cannot be built or removed on its own.
