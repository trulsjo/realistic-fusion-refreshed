[fluid-name]
rf-d-t-plasma=D-T plasma

[fluid-description]
rf-d-t-plasma=Deuterium and tritium ionised and confined. It fuses far more readily than D-D at any temperature a reactor can hold, and releases nearly five times as much per reaction.

[recipe-name]
rf-d-t-plasma=D-T plasma

[recipe-description]
rf-d-t-plasma=The same heater and the same rate as D-D plasma. What changes is what the reactor does with it.

[technology-name]
rf-tritium-breeding=Tritium breeding
rf-d-t-fusion=D-T fusion

[technology-description]
rf-tritium-breeding=Collect the tritium and helium-3 that running D-D reactors leave behind. They have been breeding it since the first one was built; this is how it gets out.
rf-d-t-fusion=Burn deuterium against bred tritium. It needs no new machine — the reactor, the heater and the plasma pipe are already built. Fed by the same heater a D-D reactor uses, a D-T reactor pays roughly four times as much, and it ignites: the plasma climbs until its own reaction rate stops it, far hotter than deuterium alone manages, and from then on the fuel line rather than the temperature is the throttle.
