[entity-description]
rf-hc-exchanger=Ten ordinary heat exchangers in one vessel: 400 MW of reactor energy into 500 °C steam. An ignited D-T reactor produces more heat than a steam farm of any reasonable size can absorb one exchanger at a time.
rf-hc-turbine=Ten ordinary steam turbines in one machine, drinking ten units of steam a tick for 58.2 MW. Roughly seven of these keep up with one high-capacity heat exchanger — the same ratio the ordinary pair has, because both halves of the tier scale together.

