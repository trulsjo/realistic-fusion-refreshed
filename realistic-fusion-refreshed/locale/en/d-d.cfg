[recipe-name]
rf-d-d-plasma=D-D plasma

[recipe-description]
rf-d-d-plasma=Injected far below fusion temperature, so fuelling a running reactor cools it a little.

[technology-name]
rf-d-d-fusion=D-D fusion

[technology-description]
rf-d-d-fusion=Confine deuterium plasma and burn it against itself, the first fusion reaction to reach and the one that breeds the fuel for the rest.\n\nA D-D reactor consumes far more power than it produces, and always will: confinement heating alone draws __1__ MW without pause, and a complete line closer to 56 MW before the first joule of fusion power exists. Build it for the tritium and helium-3 it breeds, not to power a base. Research into confinement is what eventually makes it pay for itself.
