[fluid-name]
rf-d-d-plasma=D-D plasma
rf-reactor-energy=Reactor energy

[fluid-description]
rf-d-d-plasma=Deuterium ionised and confined. Its temperature is what the reaction rate is read from, so a plasma that cannot be kept hot does not fuse.
rf-reactor-energy=The energy leaving a reactor's plasma, carried as a fluid. One unit is one megajoule.

[entity-name]
rf-heater=Plasma heater
rf-reactor=Fusion reactor
rf-heat-exchanger=Fusion heat exchanger
rf-pipe=Plasma pipe
rf-pipe-to-ground=Underground plasma pipe
rf-pump=Plasma pump
rf-isotope-collector=Isotope collector

[entity-description]
rf-heater=Ionises deuterium into plasma and injects it. Reaching fusion temperature is the reactor's job, not this machine's.
rf-reactor=Confines and heats plasma, and computes its reaction rate from tabulated cross-section data. Reactors joined by plasma pipe share one pool at one temperature.\n\nThe consumption figure the game shows for this building is not its running cost: confinement heating is taken from an internal buffer, which the engine does not count as consumption. It draws __1__ MW while it holds plasma, and never stops needing it.
rf-heat-exchanger=Burns reactor energy to raise steam at 500 °C, which ordinary steam turbines accept.
rf-pipe=Carries plasma. Ordinary pipes cannot.
rf-pipe-to-ground=Carries plasma underground.
rf-pump=Lifts plasma over a distance and forces its direction. Ordinary pumps cannot join a plasma line.
rf-isotope-collector=Bolted to a reactor, it collects the tritium and helium-3 that D-D fusion leaves behind. It breeds nothing itself: what arrives is whatever the reactor beside it actually fused, so a cold reactor fills it slowly and a hot one quickly.

