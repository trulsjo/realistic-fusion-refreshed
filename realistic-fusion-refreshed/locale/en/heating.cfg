# The plasma-heating ladder (#425, ADR 0038).
#
# ONE name for five technologies, and the missing "-1" is not an omission -- the same trap
# confinement.cfg documents. A technology whose name ends in "-<number>" is a LEVEL to Factorio: it
# strips the suffix, looks up technology-name.rf-plasma-heating, and renders the level itself.
# Numbering the keys here leaves all five showing "Unknown key", which scripts/locale-check.ps1
# catches. The descriptions below ARE numbered because each rung says something different, and
# prototypes/technology/heating.lua names those keys explicitly rather than relying on the default
# -- which would be stripped the same way and give five rungs one paragraph.
#
# THE MEGAWATTS ARE __1__ AND __2__ and come from the ladder in scripts/reactor-logic.lua, so a
# rung and its tooltip cannot disagree.
#
# EVERY RUNG SAYS THE DRAW RISES, and that is a requirement rather than a habit. ADR 0038 asks for
# it in as many words: this is a research that INCREASES a machine's consumption, and one a player
# is not warned about is one they discover as a blackout. The whole-line figures -- 56, 61, 66, 71,
# 76, 81 MW -- are ADR 0015's line table with this ladder's heating substituted into its first row;
# the other ~6 MW is the heater, two electrolysers, the extractor and a chemical plant, and none of
# those moves. They are written out here rather than interpolated because no single constant owns
# them, which is the same reason rf-d-d-fusion's own "56 MW" stays literal.
[technology-name]
rf-plasma-heating=Plasma heating

[technology-description]
rf-plasma-heating-1=More injected power into the same magnetic bottle. The reactor holds __2__ MW of confinement heating instead of __1__, settles hotter, and breeds tritium and helium-3 faster for it.\n\nIt also draws the extra 5 MW every second of every day: a D-D line goes from about 56 MW to about 61 MW. The fuel chain gets shorter and your grid gets the bill.
rf-plasma-heating-2=Neutral beam injection at a higher energy. __2__ MW instead of __1__.\n\nAbout 66 MW for the whole line now. Each rung buys less than the one before it — the plasma radiates harder the hotter it gets — and each one costs the same 5 MW.
rf-plasma-heating-3=Ion cyclotron heating tuned to the fuel rather than to the machine. __2__ MW instead of __1__.\n\nAbout 71 MW for the line. Halfway up: at the confinement time you start with, three rungs have more than halved the number of breeder reactors one fusion plant needs. They are worth less the further up the confinement ladder you take them.
rf-plasma-heating-4=Electron cyclotron resonance, driven from a gyrotron hall that is most of what the plant now costs to run. __2__ MW instead of __1__.\n\nAbout 76 MW for the line. A reactor that browns out cools, and a cold D-D plasma takes minutes to climb back — check your grid before you research this one.
rf-plasma-heating-5=Every heating system the machine has, run together at the limit of what the first wall will take. __2__ MW instead of __1__.\n\nThe last rung there is. About 81 MW for the line — half as much again as the tier cost unresearched — and a D-D reactor that turns a real profit at last, selling 102.9 MW against the 75 MW it burns. It still never crosses scientific break-even, at this heating power or at any other.
