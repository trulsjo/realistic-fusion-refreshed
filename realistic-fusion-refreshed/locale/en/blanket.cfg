[entity-name]
rf-lithium-blanket=Lithium blanket

[entity-description]
rf-lithium-blanket=Bolted to a reactor, it catches the neutrons the plasma cannot confine and breeds tritium from the lithium it is fed. The tritium leaves through the isotope collector on the same reactor. Without a collector the blanket stays idle and keeps its lithium.

[item-name]
rf-lithium-blanket=Lithium blanket

[item-description]
rf-lithium-blanket=A shell of lithium for the outside of a reactor. Every neutron it stops is a triton it can breed.

[recipe-name]
rf-lithium-blanket=Lithium blanket

[technology-name]
rf-blanket-breeding=Blanket breeding

[technology-description]
rf-blanket-breeding=Breed tritium from lithium instead of waiting for D-D reactors to leave it behind. A blanket on a D-T reactor breeds back more tritium than the reactor burns, so the tier stops draining the one below it. It works on a D-D reactor too, at half the neutrons.
