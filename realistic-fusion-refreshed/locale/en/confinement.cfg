# ONE name for three technologies, and the missing "-1" is not an omission. A technology whose
# name ends in "-<number>" is a LEVEL to Factorio: it strips the suffix, looks up
# technology-name.rf-plasma-confinement, and renders the level itself. Numbering the keys here
# leaves all three showing "Unknown key" -- caught by scripts/locale-check.ps1, which is what that
# check is for. The descriptions below are numbered because each rung says something different,
# and prototypes/technology/confinement.lua names those keys explicitly rather than relying on the
# default -- which would be stripped the same way and give three rungs one paragraph.
[technology-name]
rf-plasma-confinement=Plasma confinement

[technology-description]
rf-plasma-confinement-1=Shape the magnetic field better and the plasma keeps its heat longer. A reactor holds it for __2__ seconds instead of __1__, so it settles hotter and fuses faster.\n\nStill well short of break-even: this is a reactor run at a loss for the tritium and helium-3 it breeds, and one rung does not change that.
rf-plasma-confinement-2=Suppress the turbulence that carries heat to the wall. __2__ seconds of confinement instead of __1__.\n\nThis is the rung where the reactor almost pays for itself, and where how you supply it starts to decide whether it does. Held full it still falls just short. Held around 85 per cent full it runs hotter and crosses break-even — an under-supplied plasma is a hotter plasma, and at this temperature that buys more than the missing density costs.
rf-plasma-confinement-3=Superconducting magnets at the field strength the reaction wants. __2__ seconds of confinement instead of __1__, which is what the aneutronic reactor is built to hold.\n\nHeld full, a D-D reactor now produces more fusion power than the heating it consumes — the first rung at which it does. Tuning the supply still helps, but barely: the four per cent left here was forty per cent before any of this was researched. The tier still earns its keep as a breeder; it simply stops costing you a power plant to run.
