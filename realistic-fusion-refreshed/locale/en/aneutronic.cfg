[fluid-name]
rf-d-he3-plasma=D-He3 plasma
rf-he3-he3-plasma=He3-He3 plasma
rf-aneutronic-reactor-energy=Aneutronic reactor energy

[fluid-description]
rf-d-he3-plasma=Deuterium and helium-3 ionised and confined. Both products are charged, so nothing escapes as a neutron and every joule can be collected directly — but it needs about three times the temperature D-T does to fuse at all.
rf-he3-he3-plasma=Helium-3 burnt against itself. The only fuel in the chain with no deuterium in it, and the hardest reaction here by a long way: its cross-section peaks well above the temperature a reactor can safely hold, so it runs far below its best.
rf-aneutronic-reactor-energy=Charged fusion products leaving an aneutronic reactor. Not heat — a direct energy converter takes current straight off it, and a heat exchanger cannot use it at all.

[recipe-name]
rf-d-he3-plasma=D-He3 plasma
rf-he3-he3-plasma=He3-He3 plasma

[recipe-description]
rf-d-he3-plasma=The same heater and the same rate as every other plasma. Blend deuterium with helium-3 in a gas mixer first.
rf-he3-he3-plasma=Helium-3 straight into the heater. There is no mix to make: the reaction burns one fuel against itself.

[technology-name]
rf-helium-3-breeding=Helium-3 breeding
rf-direct-energy-conversion=Direct energy conversion
rf-aneutronic-fusion=Aneutronic fusion

[technology-description]
rf-helium-3-breeding=Every D-D reactor has been breeding helium-3 alongside its tritium. This is what lets you keep enough of it to run something on — a composite pressure vessel built for a gas that escapes ordinary tanks.
rf-direct-energy-conversion=Collect charged fusion products as electric current instead of boiling water with them. Nothing yet produces the fluid it drinks; build the converter now and it will be waiting when the aneutronic reactors arrive.
rf-aneutronic-fusion=Fuse deuterium with helium-3, and helium-3 with itself. Neither reaction releases a neutron, so neither needs a blanket, a heat exchanger or a single steam turbine. Both need a reactor built for far higher temperatures than the one you have — and He3-He3, the end of the chain, is harder than anything before it.
