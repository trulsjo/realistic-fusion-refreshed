rf-aneutronic-reactor=Aneutronic reactor
rf-direct-energy-converter=Direct energy converter
rf-aneutronic-composite-tank=Aneutronic composite tank

[entity-description]
rf-aneutronic-reactor=A denser, hotter reactor for the reactions that release no neutrons. It holds three times the plasma of a fusion reactor in the same confinement volume and spends four times the heating to reach the temperatures D-He3 and He3-He3 need. What comes out is not heat but charged particles, so it feeds a direct energy converter rather than a heat exchanger.\n\nThe consumption figure the game shows for this building is not its running cost: confinement heating is taken from an internal buffer, which the engine does not count as consumption. It draws __1__ MW while it holds plasma, and never stops needing it.
rf-direct-energy-converter=Turns aneutronic reactor energy straight into electricity. There is no steam stage and no turbine: charged fusion products are decelerated against collector plates and taken off as current, which is only possible because an aneutronic reaction puts nothing into neutrons.
rf-aneutronic-composite-tank=A pressure vessel for light gases — a metal liner overwrapped in fibre, because helium finds its way through steel joints. Buffers the aneutronic tier between reactors that burn what they are fed and a converter that drinks at a steady rate.

